<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>CARROTCAP CLI</title>
  <link rel="stylesheet" href="node_modules/@xterm/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">

    <!-- 상단 탭 바 -->
    <header id="tabbar">
      <div class="brand">🥕 CARROTCAP</div>
      <div id="tabs"></div>
      <button id="new-tab" title="새 탭 (Ctrl+T)">＋</button>
      <div class="spacer"></div>
    </header>

    <div id="body">
      <!-- 좌측 사이드바 -->
      <aside id="sidebar">
        <div class="side-section">
          <div class="side-head">
            <span>FOLDER</span>
            <button id="pick-folder" class="btn-ghost" title="폴더 열기">📁</button>
          </div>
          <div id="folder-path" class="muted small">폴더가 선택되지 않았습니다</div>
          <input id="search" type="text" placeholder="파일 검색..." />
          <div id="tree" class="tree"></div>
        </div>

        <div class="side-section">
          <div class="side-head">
            <span>QUICK CLI</span>
          </div>
          <div class="cli-buttons">
            <button class="btn-cli" data-cli="claude">CLAUDE</button>
            <button class="btn-cli" data-cli="gemini">GEMINI</button>
            <button class="btn-cli" data-cli="codex">CODEX</button>
          </div>
          <div class="cli-hint muted small">활성 페인에서 실행됩니다</div>
        </div>

        <div class="side-section">
          <div class="side-head">
            <span>SPLIT</span>
          </div>
          <div class="split-buttons">
            <button class="btn-split" data-dir="left" title="좌측 분할">◧ LEFT</button>
            <button class="btn-split" data-dir="right" title="우측 분할">◨ RIGHT</button>
            <button class="btn-split" data-dir="up" title="상단 분할">⬒ UP</button>
            <button class="btn-split" data-dir="down" title="하단 분할">⬓ DOWN</button>
          </div>
          <button id="close-pane" class="btn-ghost full" title="활성 페인 닫기">✕ 활성 페인 닫기</button>
        </div>
      </aside>

      <!-- 우측 페인 영역 (탭 컨테이너) -->
      <main id="pane-area"></main>
    </div>
  </div>

  <script src="node_modules/@xterm/xterm/lib/xterm.js"></script>
  <script src="node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="node_modules/@xterm/addon-web-links/lib/addon-web-links.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
